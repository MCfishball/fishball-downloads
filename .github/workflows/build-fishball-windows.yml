name: Build FishBall Client Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (FishBall Client 1.0.94 only)
        type: string
        required: true
        default: fishball-client-v1.0.94
      source_asset:
        description: Encrypted build source asset on the draft release
        type: string
        required: true
        default: FishBall-Client-1.0.94-build-source.tar.gz.enc
      source_sha256:
        description: SHA256 of the encrypted build source asset
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: fishball-windows-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  USE_HARD_LINKS: "false"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify and decrypt the build input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          FISHBALL_BUILD_94_KEY: ${{ secrets.FISHBALL_BUILD_94_KEY }}
        run: |
          set -Eeuo pipefail
          trap 'printf "Build input failed at line %s\n" "$LINENO" >&2' ERR
          echo 'Validating encrypted build input.'
          test "$RELEASE_TAG" = fishball-client-v1.0.94
          [[ "$SOURCE_ASSET" =~ ^[A-Za-z0-9._-]+\.enc$ ]]
          [[ "$SOURCE_SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
          test -n "$FISHBALL_BUILD_94_KEY"
          echo 'Checking the release is still a draft.'
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | tr -d '\r')" = true
          echo 'Preparing the decryption tools and temporary directory.'
          command -v openssl >/dev/null
          INPUT_ROOT="$(cygpath -u "$RUNNER_TEMP")"
          WORKSPACE_ROOT="$(cygpath -u "$GITHUB_WORKSPACE")"
          INPUT_DIR="$(mktemp -d "$INPUT_ROOT/fbc94-input.XXXXXX")"
          trap 'rm -f "$INPUT_DIR/$SOURCE_ASSET" "$INPUT_DIR/source.tar.gz"; rmdir "$INPUT_DIR"' EXIT
          echo 'Downloading encrypted build input.'
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" \
            --dir "$INPUT_DIR"
          echo 'Verifying the encrypted build input checksum.'
          ACTUAL_SHA256="$(sha256sum < "$INPUT_DIR/$SOURCE_ASSET" | cut -d ' ' -f 1 | tr -d '\r')"
          test "${ACTUAL_SHA256,,}" = "${SOURCE_SHA256,,}"
          echo 'Decrypting the verified build input.'
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$INPUT_DIR/$SOURCE_ASSET" \
            -out "$INPUT_DIR/source.tar.gz" \
            -pass env:FISHBALL_BUILD_94_KEY
          echo 'Checking the decrypted archive paths.'
          tar --force-local -tzf "$INPUT_DIR/source.tar.gz" | while IFS= read -r entry; do
            case "$entry" in
              fishball-client|fishball-client/*) ;;
              *) echo 'Unexpected path in build input' >&2; exit 1 ;;
            esac
            case "/$entry/" in
              */../*|*/./*) echo 'Invalid path in build input' >&2; exit 1 ;;
            esac
          done
          echo 'Extracting the verified build input.'
          tar --force-local -xzf "$INPUT_DIR/source.tar.gz" -C "$WORKSPACE_ROOT"
          echo 'Build input is ready.'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fishball-client/launcher/package-lock.json

      - name: Verify the release version
        shell: bash
        working-directory: fishball-client/launcher
        run: node -e "require('node:assert/strict').equal(require('./package.json').version, '1.0.94')"

      - name: Install dependencies
        working-directory: fishball-client/launcher
        run: npm ci --no-audit --no-fund

      - name: Verify the committed platform path correction
        shell: bash
        working-directory: fishball-client/launcher
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const file = 'scripts/verify-windows-package.cjs';
          const sha = data => crypto.createHash('sha256').update(data).digest('hex');
          let source = fs.readFileSync(file, 'utf8');
          assert.equal(sha(source), '287756cf06305ec96edfbcc0864a7ed4f3a382e677343c58a4e9e130adf96b77');
          for (const basename of ['windowsJavaRuntimeManifest.json', 'javaManager.js']) {
            const before = `Asar.extractFile(asar, 'dist-electron/services/${basename}')`;
            const after = `Asar.extractFile(asar, path.join('dist-electron', 'services', '${basename}'))`;
            assert.equal(source.split(before).length - 1, 1);
            source = source.replace(before, after);
          }
          assert.equal(sha(source), 'cd0c139544c4d73fc2956d1051d81bc91da317285f4df37f3639c397d986427c');
          fs.writeFileSync(file, source);
          console.log('Verified exact package verifier from committed source 1ebbf40f9.');
          NODE

      - name: Restore the immutable Windows build output
        shell: bash
        working-directory: fishball-client/launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p .ci-provenance
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11487199322" > .ci-provenance/artifact.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('.ci-provenance/artifact.json', 'utf8'));
          assert.equal(metadata.id, 11487199322);
          assert.equal(metadata.name, 'windows-94-installer-icon-proof');
          assert.equal(metadata.expired, false);
          assert.equal(metadata.digest, 'sha256:6220e8c8ed082e8ca7799bf31ed378ae35800dadae775cf70683c1d0cc23000e');
          assert.equal(metadata.workflow_run.id, 37634228688);
          assert.equal(metadata.workflow_run.head_sha, '0f90731eecc66bbe68d61ac97ea449cf06ac19ce');
          NODE
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11487199322/zip" > .ci-provenance/installers.zip
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const AdmZip = require('adm-zip');
          const archive = fs.readFileSync('.ci-provenance/installers.zip');
          assert.equal(crypto.createHash('sha256').update(archive).digest('hex'), '6220e8c8ed082e8ca7799bf31ed378ae35800dadae775cf70683c1d0cc23000e');
          const zip = new AdmZip(archive);
          const entries = zip.getEntries().filter(entry => !entry.isDirectory);
          assert.deepEqual(entries.map(entry => entry.entryName).sort(), ['FishBall-Client-win-ia32.exe', 'FishBall-Client-win-x64.exe', 'windows-icon-proof.json']);
          fs.mkdirSync('release', {recursive:true});
          for (const entry of entries) fs.writeFileSync(path.join('release', entry.entryName), zip.readFile(entry));
          const expected = {
            x64: {size:165391447, sha256:'0ff1f248f083e21c6b32f7f0dbca740aa0801d95d1ffb23aeed42827d4becc53'},
            ia32: {size:159791756, sha256:'bfe61fa44b1ab6a04044398e93071ae4d6fb2db70379e6b79c4248cfc666ca31'}
          };
          for (const arch of ['x64', 'ia32']) {
            const installer = path.join('release', `FishBall-Client-win-${arch}.exe`);
            const data = fs.readFileSync(installer);
            assert.equal(data.length, expected[arch].size);
            assert.equal(crypto.createHash('sha256').update(data).digest('hex'), expected[arch].sha256);
            const unpacked = path.resolve('release', arch === 'x64' ? 'win-unpacked' : 'win-ia32-unpacked');
            const files = ['FishBall Client.exe', 'resources/icon-win.png', 'resources/runtime/*', 'resources/app.asar',
              'resources/app.asar.unpacked/node_modules/keytar/build/Release/keytar.node',
              'resources/app.asar.unpacked/node_modules/@azure/msal-node-runtime/dist/msal-node-runtime.node',
              `resources/app.asar.unpacked/node_modules/@azure/msal-node-extensions/bin/${arch}/dpapi.node`,
              'resources/mods/fishball-client-mod.jar', 'resources/mods/fishball-identity-mod.jar'];
            execFileSync(require('7zip-bin').path7za, ['x', installer, ...files, '-o' + unpacked, '-y'], {stdio:'inherit'});
          }
          console.log('Restored exact installers from immutable run 37634228688 artifact 11487199322.');
          NODE

      - name: Record packaged Windows icon proof
        shell: bash
        working-directory: fishball-client/launcher
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const PE = require('pe-library');
          const ResEdit = require('resedit');
          const hash = data => crypto.createHash('sha256').update(Buffer.from(data)).digest('hex');
          const frames = items => items.map(item => ({
            raw: item.isRaw(), width: item.width, height: item.height, bitCount: item.bitCount,
            bytes: item.isRaw() ? item.bin.byteLength : item.generate().byteLength,
            sha256: hash(item.isRaw() ? item.bin : item.generate())
          }));
          const expected = frames(ResEdit.Data.IconFile.from(fs.readFileSync('build/icon-win.ico')).icons.map(item => item.data));
          const files = [
            'release/win-unpacked/FishBall Client.exe',
            'release/win-ia32-unpacked/FishBall Client.exe',
            'release/FishBall-Client-win-x64.exe',
            'release/FishBall-Client-win-ia32.exe'
          ];
          const proof = { version: require('./package.json').version, expected, files: files.map(file => {
            const bytes = fs.readFileSync(file);
            const executable = PE.NtExecutable.from(bytes, {ignoreCert: true});
            const resources = PE.NtExecutableResource.from(executable);
            return { file, bytes: bytes.length, sha256: hash(bytes),
              groups: ResEdit.Resource.IconGroupEntry.fromEntries(resources.entries).map(group => ({
                id: group.id, lang: group.lang, directoryFrames: group.icons,
                resourceFrames: resources.entries.filter(entry => entry.type === 3 && entry.lang === group.lang && group.icons.some(icon => icon.iconID === entry.id)).map(entry => ({
                  id: entry.id, lang: entry.lang, bytes: entry.bin.byteLength, sha256: hash(entry.bin)
                })),
                decodedFrames: frames(group.getIconItemsFromEntries(resources.entries))
              }))
            };
          })};
          fs.writeFileSync(path.join('release', 'windows-icon-proof.json'), JSON.stringify(proof, null, 2) + '\n');
          console.log(JSON.stringify(proof, null, 2));
          NODE

      - name: Verify both Windows apps and installers
        shell: bash
        working-directory: fishball-client/launcher
        run: |
          node scripts/verify-windows-package.cjs release/win-unpacked x64 release/FishBall-Client-win-x64.exe
          node scripts/verify-windows-package.cjs release/win-ia32-unpacked ia32 release/FishBall-Client-win-ia32.exe

      - name: Generate and verify Windows update metadata
        shell: bash
        working-directory: fishball-client/launcher
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const yaml = require('js-yaml');
          const {executeAppBuilderAsJson} = require('app-builder-lib/out/util/appBuilder');
          (async () => {
            const version = require('./package.json').version;
            assert.equal(version, '1.0.94');
            const names = ['FishBall-Client-win-x64.exe', 'FishBall-Client-win-ia32.exe'];
            for (const name of names) {
              const file = path.join('release', name);
              await executeAppBuilderAsJson(['blockmap', '--input', file, '--output', file + '.blockmap']);
              assert.ok(fs.statSync(file + '.blockmap').size > 0);
            }
            const files = names.map(url => {
              const data = fs.readFileSync(path.join('release', url));
              return { url, sha512: crypto.createHash('sha512').update(data).digest('base64'), size: data.length };
            });
            const feedPath = path.join('release', 'latest.yml');
            const feed = { version, files, path: files[0].url, sha512: files[0].sha512, releaseDate: new Date().toISOString() };
            fs.writeFileSync(feedPath, yaml.dump(feed, { lineWidth: -1 }));
            const actual = yaml.load(fs.readFileSync(feedPath, 'utf8'));
            assert.equal(actual.version, version);
            assert.deepEqual(actual.files, files);
            assert.equal(actual.path, files[0].url);
            assert.equal(actual.sha512, files[0].sha512);
            console.log('Verified 1.0.94 Windows feed and regenerated official blockmaps for exact x64 and ia32 installers.');
          })().catch(error => { console.error(error); process.exitCode=1; });
          NODE

      - name: Upload verified installers to the existing draft
        shell: bash
        working-directory: fishball-client/launcher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          trap 'printf "Draft upload failed at line %s\n" "$LINENO" >&2' ERR
          echo 'Checking the verified release upload target.'
          test "$RELEASE_TAG" = fishball-client-v1.0.94
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | tr -d '\r')" = true
          echo 'Uploading the five verified Windows release files to the draft.'
          gh release upload "$RELEASE_TAG" \
            release/FishBall-Client-win-x64.exe \
            release/FishBall-Client-win-x64.exe.blockmap \
            release/FishBall-Client-win-ia32.exe \
            release/FishBall-Client-win-ia32.exe.blockmap \
            release/latest.yml \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Retain installer and icon evidence
        if: ${{ always() && hashFiles('fishball-client/launcher/release/FishBall-Client-win-*.exe') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-94-installer-icon-proof
          retention-days: 1
          if-no-files-found: error
          path: |
            fishball-client/launcher/release/FishBall-Client-win-x64.exe
            fishball-client/launcher/release/FishBall-Client-win-ia32.exe
            fishball-client/launcher/release/windows-icon-proof.json
