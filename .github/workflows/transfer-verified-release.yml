name: Transfer verified FishBall v1.0.35 release
on:
  workflow_dispatch:
    inputs:
      assets:
        description: Expiring download URLs for the already verified v1.0.35 assets
        required: true
        type: string
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify and transfer the fixed v1.0.35 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYWORKER'
          import concurrent.futures, hashlib, json, os, pathlib, subprocess, tempfile, urllib.parse, urllib.request
          
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'MCfishball/fishball-downloads'
          tag = 'fishball-client-v1.0.35'
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assets = json.loads(event['inputs']['assets'])
          expected = {'FishBall-Client-mac-arm64.dmg': [114302395, 'b795b55aeeda61f136c497e0c4983faccaefba44c6b7e931f8ee42bb0e593e65'], 'FishBall-Client-mac-arm64.dmg.blockmap': [119960, '4ee1fe6fefe59cd62d0897243e64d104057b609b9c65682a614b9f0bec3ce1e5'], 'FishBall-Client-mac-arm64.zip': [109328597, 'bebc7dcbdf7a84ddf5f25de748995c145305a961cc9c122e0d1052d06f626a96'], 'FishBall-Client-mac-arm64.zip.blockmap': [114762, 'ddc1061e0b80cfdc7148c332174b93ab7175dcda00215ee03926ec977b41dcac'], 'FishBall-Client-mac-x64.dmg': [120148329, 'd163ccc3b33df11320c19c6dbfeaeb6277bcdec3420a0274870c2e1b0d44e090'], 'FishBall-Client-mac-x64.dmg.blockmap': [126597, '2369a0a7ff6cb288d3249dd5b31c59ff7497d8a1ff919b216226f35e16166cd4'], 'FishBall-Client-mac-x64.zip': [115180938, '43968cb9b4ffb16629ad6dc6822ce0ccab52478b905fcff22b8ffd2a28094426'], 'FishBall-Client-mac-x64.zip.blockmap': [119131, '8c4cd5525ce90ee9dba464aede4c90cd2e2061fa35182c8c2ae1a61b7038d7b0'], 'FishBall-Client-win-ia32.exe': [95362273, '530547d8a607f21fa3fe5743008e93996b8e0b9b260c420e1b92bfa93e8eedda'], 'FishBall-Client-win-ia32.exe.blockmap': [99157, 'b61e6273da46da24e4c2bb19d3b70d5fce537458202e3cd364be1b2943ff465d'], 'FishBall-Client-win-x64.exe': [100172948, 'e7ccc5d4cd2069f5b5da6e350304a20297b95673d4116b1c4e545d6680df0d79'], 'FishBall-Client-win-x64.exe.blockmap': [103915, '1a3aa1a452f6bb385235044c4b047f7afbdf0cb312a0b99961b0fd177cc0acee'], 'latest-mac.yml': [832, '00c5866d36769015d41c67250d0afe227581a41fcaed422e40d0d006b7e0b10c'], 'latest.yml': [519, '9fa61bb4a5c3c19aeb53be5092d89896b2c1ec24d6dec365c1cfe1bd53d50aef']}
          assert {a['name'] for a in assets} == set(expected)
          release = json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','isDraft,assets'],text=True))
          assert release['isDraft'], 'Only the existing draft may be updated'
          present = {a['name']: a for a in release['assets']}
          root = pathlib.Path(tempfile.mkdtemp(prefix='verified-fishball-release-'))
          
          def transfer(a):
              name = a['name']
              assert pathlib.Path(name).name == name
              size, digest = expected[name]
              assert a['size'] == size and a['sha256'] == digest
              if name in present and present[name]['state'] == 'uploaded':
                  assert present[name]['size'] == size and present[name]['digest'] == 'sha256:'+digest
                  print('Already verified:', name, flush=True)
                  return
              url = urllib.parse.urlsplit(a['url'])
              assert url.scheme == 'https' and url.hostname == 'release-assets.githubusercontent.com'
              path = root/name
              h = hashlib.sha256()
              with urllib.request.urlopen(a['url'], timeout=120) as response, path.open('wb') as f:
                  assert response.status == 200
                  while True:
                      b = response.read(4*1024*1024)
                      if not b: break
                      h.update(b); f.write(b)
              assert path.stat().st_size == size and h.hexdigest() == digest, name
              subprocess.run(['gh','release','upload',tag,str(path),'--repo',repo,'--clobber'],check=True,timeout=600)
              print('Transferred verified asset:', name, flush=True)
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(transfer, assets))
          print('All v1.0.35 installer files transferred. Release remains a draft.')
          PYWORKER
